      const { useState, useEffect, useContext, createContext } = React;

      // Robust Self-Contained SPA Router
      const RouterContext = createContext({ currentPath: '/' });

      const Router = ({ children }) => {
        const getPath = () => {
          const hash = window.location.hash.replace(/^#/, '');
          if (!hash || hash === '') return '/';
          return hash.split('?')[0];
        };

        const [currentPath, setCurrentPath] = useState(getPath());

        useEffect(() => {
          const handleHashChange = () => {
            setCurrentPath(getPath());
          };
          window.addEventListener('hashchange', handleHashChange);
          return () => window.removeEventListener('hashchange', handleHashChange);
        }, []);

        const navigate = (path) => {
          window.location.hash = path;
          setCurrentPath(path);
        };

        return (
          <RouterContext.Provider value={{ currentPath, navigate }}>
            {children}
          </RouterContext.Provider>
        );
      };

      const useLocation = () => {
        const ctx = useContext(RouterContext);
        return { pathname: ctx ? ctx.currentPath : '/' };
      };

      const useNavigate = () => {
        const ctx = useContext(RouterContext);
        return ctx ? ctx.navigate : (p) => { window.location.hash = p; };
      };

      const Link = ({ to, children, className, style, onClick, title, ...props }) => {
        const { navigate } = useContext(RouterContext);
        const handleClick = (e) => {
          if (to && to.startsWith('/#')) {
            // Anchor scroll on home
            return;
          }
          if (to && to.startsWith('#')) {
            return;
          }
          e.preventDefault();
          navigate(to);
          if (onClick) onClick(e);
        };
        return (
          <a href={`#${to}`} className={className} style={style} onClick={handleClick} title={title} {...props}>
            {children}
          </a>
        );
      };

      const Routes = ({ children }) => {
        const { currentPath } = useContext(RouterContext);
        let match = null;
        let fallback = null;

        React.Children.forEach(children, (child) => {
          if (!React.isValidElement(child)) return;
          if (child.props.path === currentPath) {
            match = child.props.element;
          } else if (child.props.path === '*') {
            fallback = child.props.element;
          }
        });

        return match || fallback || null;
      };

        const [activeQuickView, setActiveQuickView] = useState(null);
        const [wishlist, setWishlist] = useState([]);
        const [toasts, setToasts] = useState([]);

        const addToast = (message) => {
          const id = Date.now();
          setToasts((prev) => [...prev, { id, message }]);
          setTimeout(() => {
            setToasts((prev) => prev.filter((t) => t.id !== id));
          }, 3500);
        };

        const addToCart = (product, color = 'Classic', quantity = 1) => {
          setCart((prev) => {
            const existing = prev.find(
              (item) => item.id === product.id && item.color === color
            );
            if (existing) {
              return prev.map((item) =>
                item.id === product.id && item.color === color
                  ? { ...item, quantity: item.quantity + quantity }
                  : item
              );
            }
            return [
              ...prev,
              {
                id: product.id,
                name: product.name,
                price: product.price,
                image: product.image,
                color,
                quantity
              }
            ];
          });
          addToast(`Added "${product.name}" (${color}) to bag.`);
          setIsCartOpen(true);
        };

        const removeFromCart = (id, color) => {
          setCart((prev) => prev.filter((item) => !(item.id === id && item.color === color)));
          addToast('Item removed from bag.');
        };

        const updateQuantity = (id, color, delta) => {
          setCart((prev) =>
            prev
              .map((item) => {
                if (item.id === id && item.color === color) {
                  const newQty = item.quantity + delta;
                  return newQty > 0 ? { ...item, quantity: newQty } : null;
                }
                return item;
              })
              .filter(Boolean)
          );
        };

        const toggleWishlist = (productId) => {
          setWishlist((prev) => {
            if (prev.includes(productId)) {
              addToast('Removed from wishlist.');
              return prev.filter((id) => id !== productId);
            } else {
              addToast('Saved to wishlist!');
              return [...prev, productId];
            }
          });
        };

        const cartTotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
        const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

            value={{
              cart,
              addToCart,
              removeFromCart,
              updateQuantity,
              cartTotal,
              cartCount,
              isCartOpen,
              setIsCartOpen,
              activeQuickView,
              setActiveQuickView,
              wishlist,
              toggleWishlist,
              toasts,
              addToast

          >
            {children}

      const CustomCursor = () => {

        useEffect(() => {
          const handleMouseMove = (e) => setPos({ x: e.clientX, y: e.clientY });
          const handleMouseOver = (e) => {
            setIsHovered(!!e.target.closest('button, a, input, select'));
          };
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseover', handleMouseOver);
          return () => {
            window.removeEventListener('mousemove', handleMouseMove);
            window.removeEventListener('mouseover', handleMouseOver);
          };
        }, []);

        return (
          <React.Fragment>
            <div
              style={{
                position: 'fixed',
                top: 0,
                left: 0,
                width: '8px',
                height: '8px',
                backgroundColor: '#d4af37',
                borderRadius: '50%',
                pointerEvents: 'none',
                zIndex: 9999,
                transform: `translate3d(${pos.x - 4}px, ${pos.y - 4}px, 0)`

            />
            <div

                top: 0,
                left: 0,

      const ProductPage = () => {

                </div>
              </div>
            </div>
          </section>

          <React.Fragment>

                          </div>
                          <button onClick={() => removeFromCart(item.id, item.color)} style={{ fontSize: '0.78rem', color: 'var(--danger)' }}>Remove</button>

                      </div>

                <p style={{ fontStyle: 'italic', color: 'var(--gold)', fontSize: '0.9rem' }}>"{activeQuickView.tagline}"</p>
                <p style={{ fontSize: '0.9rem', color: 'var(--text-secondary)' }}>{activeQuickView.description}</p>

        <footer className="footer">

                <p>Timeless luxury crafted for modern elegance. Every bag is an uncompromising promise of artistry, endurance, and presence.</p>

              <div className="footer-col">

                  <li><Link to="/shop">Designer Handbags</Link></li>

      root.render(
        <Router>
          <StoreProvider>

        </Router>
      );

  </body>
</html>
